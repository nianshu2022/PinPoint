name: Deploy to Cloudflare Pages

# 触发条件：推送到 main 分支，或手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ════════════════════════════════════════════════════════════════════════
# 所需 GitHub Secrets（仓库 Settings → Secrets and variables → Actions）：
#
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token
#                           创建地址：dash.cloudflare.com → My Profile → API Tokens
#                           需要权限（自定义 token）：
#                             · Cloudflare Pages: Edit
#                             · D1: Edit
#                             · Account Settings: Read
#
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
#                           查看位置：dash.cloudflare.com 右侧边栏
# ════════════════════════════════════════════════════════════════════════

env:
  # Cloudflare Pages 项目名（第一次运行会自动创建）
  CF_PAGES_PROJECT: pinpoint
  # D1 数据库名（第一次运行会自动创建）
  CF_D1_DATABASE: pinpoint-db
  # D1 在 Pages 中的 binding 变量名（server 代码里通过 env.DB 访问）
  CF_D1_BINDING: DB
  # Node.js 版本
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. 代码检出 ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 pnpm（从 package.json 的 packageManager 自动读取版本）──
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── 3. 安装 Node.js ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # ── 4. 安装依赖 ────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. 创建 Cloudflare Pages 项目（如已存在则跳过）──────────────────
      #    使用 wrangler pages project create，它自带幂等处理
      - name: Create Cloudflare Pages project (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 Creating/verifying Pages project '${{ env.CF_PAGES_PROJECT }}'..."
          # create 命令若项目已存在会报错，用 || true 屏蔽，下面的 list 验证
          pnpm wrangler pages project create "${{ env.CF_PAGES_PROJECT }}" \
            --production-branch=main 2>&1 || true

          # 验证项目确实存在
          if pnpm wrangler pages project list 2>&1 | grep -q "${{ env.CF_PAGES_PROJECT }}"; then
            echo "✅ Pages project '${{ env.CF_PAGES_PROJECT }}' is ready."
          else
            echo "❌ Pages project not found after creation attempt, please check API token permissions."; exit 1
          fi

      # ── 6. 创建 D1 数据库（如已存在则跳过），保存 ID 到环境变量 ──────────
      - name: Create D1 database (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 Creating/verifying D1 database '${{ env.CF_D1_DATABASE }}'..."
          # create 命令若 DB 已存在会报错，用 || true 屏蔽
          pnpm wrangler d1 create "${{ env.CF_D1_DATABASE }}" 2>&1 || true

          # 获取数据库 ID
          DB_INFO=$(pnpm wrangler d1 list --json 2>/dev/null | \
            jq -r --arg name "${{ env.CF_D1_DATABASE }}" \
            '.[] | select(.name == $name)')

          if [ -z "$DB_INFO" ]; then
            echo "❌ D1 database not found after creation attempt."; exit 1
          fi

          DB_ID=$(echo "$DB_INFO" | jq -r '.uuid')
          echo "✅ D1 database ready: $DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> $GITHUB_ENV

      # ── 7. 将 D1 绑定到 Pages 项目（通过 Cloudflare REST API PATCH）─────
      #    wrangler 目前没有直接 CLI 命令设置 Pages binding，只能用 API
      - name: Bind D1 to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔗 Binding D1 ($D1_DATABASE_ID) to Pages as '${{ env.CF_D1_BINDING }}'..."
          RESP=$(curl -s -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ env.CF_PAGES_PROJECT }}" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"d1_databases\": {
                    \"${{ env.CF_D1_BINDING }}\": { \"id\": \"$D1_DATABASE_ID\" }
                  }
                },
                \"preview\": {
                  \"d1_databases\": {
                    \"${{ env.CF_D1_BINDING }}\": { \"id\": \"$D1_DATABASE_ID\" }
                  }
                }
              }
            }")
          if [ "$(echo "$RESP" | jq -r '.success')" != "true" ]; then
            echo "⚠️ D1 binding API returned non-success (may already be bound):"
            echo "$RESP" | jq .
          else
            echo "✅ D1 binding updated."
          fi

      # ── 8. 准备数据库迁移文件 ──────────────────────────────────────────
      - name: Prepare database migrations
        run: |
          echo "📦 Preparing migrations..."
          pnpm db:generate || true
          echo "📄 Migration files:"
          ls -1 server/database/migrations/*.sql 2>/dev/null || echo "  (none found)"

      # ── 9. 应用迁移到 D1（幂等，已存在的表会被忽略）────────────────────
      - name: Apply migrations to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MIGRATION_DIR="server/database/migrations"
          SQL_FILES=$(ls "$MIGRATION_DIR"/*.sql 2>/dev/null | sort || true)

          if [ -z "$SQL_FILES" ]; then
            echo "⚠️ No migration files found, skipping."
          else
            echo "🗄️ Applying migrations to D1 '${{ env.CF_D1_DATABASE }}'..."
            for SQL_FILE in $SQL_FILES; do
              echo "  → $SQL_FILE"
              pnpm wrangler d1 execute "${{ env.CF_D1_DATABASE }}" \
                --remote \
                -y \
                --file="$SQL_FILE" \
                2>&1 | tail -5 \
                || echo "  ⚠️ May already exist (idempotent), continuing..."
            done
            echo "✅ Migrations done."
          fi

      # ── 10. 构建 workspace 依赖包（@chronoframe/webgl-image）──────────
      - name: Build workspace dependencies
        run: |
          echo "📦 Building @chronoframe/webgl-image..."
          pnpm build:deps
          echo "✅ Workspace dependencies built."

      # ── 11. 构建 Nuxt 应用（Cloudflare Pages 目标）────────────────────
      - name: Build Nuxt application
        env:
          CF_PAGES: '1'
          NODE_ENV: production
          NITRO_PRESET: cloudflare_pages
        run: |
          echo "🔨 Building for Cloudflare Pages..."
          pnpm build
          echo "✅ Build complete."
          ls -la dist/ 2>/dev/null || ls -la .output/ 2>/dev/null || true

      # ── 11. 部署到 Cloudflare Pages ────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying to Cloudflare Pages..."
          pnpm wrangler pages deploy dist \
            --project-name="${{ env.CF_PAGES_PROJECT }}" \
            --branch=main
          echo "🎉 Deployment complete!"
